<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Piramida Angka</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #2d2d2d;
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 16px 48px;
}
h1 {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 28px;
  text-align: center;
  letter-spacing: 0.5px;
}
.input-box {
  width: 100%;
  max-width: 380px;
  background: #8bc34a;
  border-radius: 4px;
  padding: 16px;
  margin-bottom: 8px;
  text-align: center;
}
.input-box input {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 2px solid #fff;
  color: #fff;
  font-size: 36px;
  font-weight: 600;
  text-align: center;
  letter-spacing: 10px;
  font-variant-numeric: tabular-nums;
  outline: none;
  padding-bottom: 4px;
}
.input-box input::placeholder { color: rgba(255,255,255,0.5); }
.hint {
  font-size: 14px;
  color: #ccc;
  margin-bottom: 24px;
  text-align: center;
}
.btn-row {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 36px;
}
.btn-primary {
  background: #8d7e6b;
  color: #fff;
  border: none;
  padding: 14px 28px;
  font-size: 18px;
  font-weight: 600;
  border-radius: 4px;
  cursor: pointer;
  transition: opacity 0.15s;
}
.btn-primary:active { opacity: 0.8; }
.btn-icon {
  background: transparent;
  border: 2px solid #fff;
  color: #fff;
  width: 48px;
  height: 48px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.15s;
}
.btn-icon:active { opacity: 0.7; }
.pyramid {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  width: 100%;
}
.pyramid-row {
  display: flex;
  gap: 14px;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: translateY(10px);
  animation: popIn 0.3s ease-out forwards;
}
.pyramid-row span {
  font-size: 38px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  min-width: 28px;
  text-align: center;
}
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #1a1a1a;
  color: #fff;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  transition: all 0.2s ease-out;
  z-index: 100;
  white-space: nowrap;
  border: 1px solid #444;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@keyframes popIn { to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<h1>Piramida Angka</h1>

<div class="input-box">
  <input id="numInput" type="text" placeholder="12345" maxlength="20" autocomplete="off" inputmode="numeric">
</div>
<div class="hint">Ketik angka tanpa spasi</div>

<div class="btn-row">
  <button class="btn-primary" onclick="buildPyramid()">Buat Piramida</button>
  <button class="btn-icon" onclick="copyResult()" title="Copy">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
    </svg>
  </button>
  <button class="btn-icon" onclick="resetAll()" title="Reset">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"></polyline>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
    </svg>
  </button>
</div>

<div id="pyramid" class="pyramid"></div>
<div id="toast" class="toast"></div>

<script>
function mod9(a, b) {
  let s = a + b;
  let r = s % 9;
  return r === 0 ? 9 : r;
}

function buildRows(nums) {
  const rows = [nums.slice()];
  let cur = nums;
  while (cur.length > 1) {
    const nxt = [];
    for (let i = 0; i < cur.length - 1; i++) nxt.push(mod9(cur[i], cur[i + 1]));
    rows.push(nxt);
    cur = nxt;
  }
  return rows;
}

function buildPyramid() {
  const raw = document.getElementById('numInput').value;
  const nums = raw.replace(/\s/g, '').split('').map(Number).filter(n => !isNaN(n) && n >= 0 && n <= 9);
  if (nums.length < 2) { showToast('Masukkan minimal 2 angka'); return; }
  const box = document.getElementById('pyramid');
  box.innerHTML = '';
  const rows = buildRows(nums);
  rows.forEach((row, idx) => {
    const el = document.createElement('div');
    el.className = 'pyramid-row';
    el.style.animationDelay = (idx * 0.07) + 's';
    row.forEach(n => {
      const sp = document.createElement('span');
      sp.textContent = n;
      el.appendChild(sp);
    });
    box.appendChild(el);
  });
}

function copyResult() {
  const box = document.getElementById('pyramid');
  if (!box.children.length) { showToast('Belum ada hasil'); return; }
  let txt = '';
  Array.from(box.children).forEach(r => {
    txt += Array.from(r.children).map(s => s.textContent).join(' ') + '\n';
  });
  navigator.clipboard.writeText(txt.trim()).then(() => showToast('Disalin!'));
}

function resetAll() {
  document.getElementById('numInput').value = '';
  document.getElementById('pyramid').innerHTML = '';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

document.getElementById('numInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') buildPyramid();
});
</script>

</body>
</html>
